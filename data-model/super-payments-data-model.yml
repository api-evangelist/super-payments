entities:
  - name: PaymentIntent
    resource: /payments
    id_field: id (transactionId)
    notes: Created for e-commerce transactions; searchable via /payments/search. 402 on decline.
  - name: PaymentTransaction
    resource: /payments/search, /payments/{transactionId}
    id_field: transactionId
    notes: The settled/queryable view of a payment, with funding attempts and card metadata.
  - name: Refund
    resource: /refunds
    id_field: transactionId
    notes: Initiated against a payment transaction; payout refunds are a restricted variant.
  - name: Settlement
    resource: /settlements
    id_field: settlementId
    notes: Batch of payments paid out to the merchant, with reconciliation rows.
  - name: CheckoutSession
    resource: /checkout-sessions
    id_field: id (checkoutSessionId)
    notes: Orchestrates a payment; can carry a customer for recurring payments and order line items.
  - name: PaymentLink
    resource: /payment-links
    id_field: linkId
    notes: No-code hosted link that yields a payment.
  - name: Customer
    resource: /customers
    id_field: id (customerId)
    notes: Merchant-known customer; may carry an externalReference and emailAddress.
  - name: PaymentMethod
    resource: /payment-methods
    id_field: id
    notes: Reusable payment instrument associated with a customer for off-session payments.
  - name: SetupIntent
    resource: /payment-methods/{id}/setup-intents
    id_field: id
    notes: Orchestrates setting up a payment method (e.g. via the super-card component).
  - name: RewardConfiguration
