        amount:
          description: Amount of funds transferred with this funding source
          example:
            amount: '1000'
            currency: GBP
          allOf:
          - $ref: '#/components/schemas/TransactionCurrencyAmount'
        reference:
          description: Reference identifier for the funding transaction
          type:
          - string
          - 'null'
          examples:
          - INV-12345
        institutionId:
          description: 'Identifier of the financial institution used for the payment. Deprecated: use the institutionId field in the fundingDetails object instead.'
          type:
          - string
          - 'null'
          examples:
          - uk_ob_aib
          deprecated: true
        institutionName:
          description: 'Display name of the financial institution used for the payment. Deprecated: use the institutionName field in the fundingDetails object instead.'
          type:
          - string
          - 'null'
          examples:
          - Allied Irish Bank
          deprecated: true
        dispute:
          description: Information about an associated dispute, if any
          allOf:
          - $ref: '#/components/schemas/DisputeDto'
        type:
          description: Type of funding source used for the payment or refund
          type: string
          examples:
          - CARD
          enum:
          - BNPL
          - CARD
          - CASH_REWARD
          - OPEN_BANKING
        fundingDetails:
          description: Detailed metadata about the specific funding method used. The type field determines which schema to use.
          discriminator:
            propertyName: type
            mapping:
              CARD: '#/components/schemas/CardPaymentFundingDetailsDto'
              OPEN_BANKING: '#/components/schemas/OpenBankingPaymentFundingDetailsDto'
              CASH_REWARD: '#/components/schemas/CashRewardPaymentFundingDetailsDto'
              BUY_NOW_PAY_LATER: '#/components/schemas/BuyNowPayLaterPaymentFundingDetailsDto'
          oneOf:
          - $ref: '#/components/schemas/CardPaymentFundingDetailsDto'
            title: Card Payment
          - $ref: '#/components/schemas/OpenBankingPaymentFundingDetailsDto'
            title: Open Banking Payment
          - $ref: '#/components/schemas/CashRewardPaymentFundingDetailsDto'
            title: Cash Reward Payment
          - $ref: '#/components/schemas/BuyNowPayLaterPaymentFundingDetailsDto'
            title: Buy Now Pay Later Payment
          - type: 'null'
      required:
      - amount
      - reference
      - institutionId
      - institutionName
      - type
    CardPaymentFundingDetailsDto:
      type: object
      properties:
        type:
          description: Type of funding details - always "CARD" for card payments. Card payments include credit and debit card transactions processed through payment networks like Visa, Mastercard, etc.
          example: CARD
          allOf:
          - $ref: '#/components/schemas/CardPaymentType'
        threeDSAuthentication:
          description: 3D Secure authentication details for the card payment
          allOf:
          - $ref: '#/components/schemas/ThreeDSDto'
        cvcCheck:
          description: Result of the CVC check (pass, fail, unavailable, etc.)
          type:
          - string
          - 'null'
        zipCheck:
          description: Result of the postal/zip code check (pass, fail, unavailable, etc.)
          type:
          - string
          - 'null'
        riskFactor:
          description: Risk factor score for the transaction (higher indicates higher risk)
          type:
          - number
          - 'null'
        riskLevel:
          description: Risk level assessment for the transaction (e.g., low, medium, high)
          type:
          - string
          - 'null'
        fingerprint:
          description: Unique fingerprint identifier for the card
          type:
          - string
          - 'null'
        issuer:
          description: Issuing bank or financial institution for the card
          type:
          - string
          - 'null'
        address:
          description: Billing address associated with the card
          allOf:
          - $ref: '#/components/schemas/AddressDto'
        country:
          description: Country code where the card was issued
          type:
          - string
          - 'null'
        nameOnCard:
          description: Cardholder name as it appears on the card
          type:
          - string
          - 'null'
        product:
          description: Card product type (e.g., credit, debit, prepaid)
          type:
          - string
          - 'null'
        funding:
          description: Funding type of the card (e.g., credit, debit, prepaid)
          type:
          - string
          - 'null'
        authorisationCode:
          description: Authorization code provided by the card issuer
          type:
          - string
          - 'null'
        failureCode:
          description: Code indicating the reason for transaction failure, if applicable
          type:
          - string
          - 'null'
        last4:
          description: Last 4 digits of the card number
          type:
          - string
          - 'null'
        cardDescription:
          description: Description of the card type (e.g., Visa Credit, Mastercard Debit)
          type:
          - string
          - 'null'
        cardClassification:
          description: Classification of the card as either CORPORATE or CONSUMER
          type:
          - string
          - 'null'
          enum:
          - CONSUMER
          - CORPORATE
        walletType:
          description: Type of digital wallet used (e.g., Apple Pay, Google Pay)
          type:
          - string
          - 'null'
        walletLast4:
          description: Last 4 digits of the card stored in the digital wallet
          type:
          - string
          - 'null'
        providerData:
          description: Provider-specific data for the card payment (e.g. Stripe metadata)
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      required:
      - type
      - threeDSAuthentication
      - cvcCheck
      - zipCheck
      - riskFactor
      - riskLevel
      - fingerprint
      - issuer
      - address
      - country
      - nameOnCard
      - product
      - funding
      - authorisationCode
      - failureCode
      - last4
      - cardDescription
      - cardClassification
      - walletType
      - walletLast4
      - providerData
