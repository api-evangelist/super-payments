components:
  schemas:
    ThreeDSDto:
      type: object
      properties:
        status:
          description: Status of 3DS authentication (e.g., authenticated, attempted, failed)
          type:
          - string
          - 'null'
        version:
          description: Version of 3DS used for authentication
          type:
          - string
          - 'null'
        authentication_flow:
          description: Authentication flow (e.g., challenge, frictionless)
          type:
          - string
          - 'null'
        electronic_commerce_indicator:
          description: Electronic commerce indicator
          type:
          - string
          - 'null'
        exemption_indicator:
          description: Exemption indicator
          type:
          - string
          - 'null'
        result:
          description: Authentication result
          type:
          - string
          - 'null'
        result_reason:
          description: Reason for the authentication result
          type:
          - string
          - 'null'
        transaction_id:
          description: Transaction ID for the 3DS authentication
          type:
          - string
          - 'null'
      required:
      - status
      - version
      - authentication_flow
      - electronic_commerce_indicator
      - exemption_indicator
      - result
      - result_reason
      - transaction_id
    CashRewardPaymentFundingDetailsDto:
      type: object
      properties:
        type:
          description: Type identifier for cash reward payment funding details. Cash rewards payments use stored value from the customer's Super Payments account balance.
          example: CASH_REWARD
          allOf:
          - $ref: '#/components/schemas/CashRewardPaymentType'
      required:
      - type
    PaymentIntentAddressDto:
      description: Address information for shipping or billing
      type: object
      properties:
        addressLine1:
          type:
          - string
          - 'null'
          default: null
        addressLine2:
          type:
          - string
          - 'null'
          default: null
        addressLine3:
          type:
          - string
          - 'null'
          default: null
        city:
          type:
          - string
          - 'null'
          default: null
        country:
          type:
          - string
          - 'null'
          default: null
        postCode:
          type:
          - string
          - 'null'
          default: null
        firstName:
          type:
          - string
          - 'null'
          default: null
        lastName:
          type:
          - string
          - 'null'
          default: null
        phone:
          type:
          - string
          - 'null'
          default: null
        email:
          type:
          - string
          - 'null'
          format: email
          default: null
    PaymentIntentProductDto:
      description: Product line item with type and data fields
      type: object
      properties:
        type:
          description: The line item type
          type: string
          const: PRODUCT
        data:
          description: Product line item data
          type: object
          properties:
            productDescription:
              description: Description of the product
              type: string
            sku:
              description: Stock Keeping Unit (SKU) identifier for the product
              type: string
            quantity:
              description: Quantity of the product
              type: number
              minimum: 1
            unitPrice:
              description: Unit price in minor units (e.g., pence for GBP)
              type: number
              minimum: 0
            currency:
              description: Currency code
              type: string
              const: GBP
            expectedDeliveryDate:
              description: When delivery is expected to take place, either as a date (YYYY-MM-DD) or datetime with timezone
              oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
              - type: 'null'
      required:
      - type
      - data
    CreatePaymentIntentInput:
      discriminator:
        propertyName: offSession
        mapping:
          'true': '#/components/schemas/CreateOffSessionPaymentIntentInput'
          'false': '#/components/schemas/CreateOnSessionPaymentIntentInput'
      oneOf:
      - $ref: '#/components/schemas/CreateOffSessionPaymentIntentInput'
      - $ref: '#/components/schemas/CreateOnSessionPaymentIntentInput'
    CreateOnSessionPaymentIntentInput:
      type: object
      properties:
        externalReference:
          description: External reference for the payment
          type: string
          examples:
          - order-12345
          maxLength: 255
        amount:
          description: Amount in minor units (pence for GBP)
          type: integer
          examples:
          - 1234
          maximum: 9999999
          minimum: 1
        currency:
          description: Currency code
          type: string
          examples:
          - GBP
          const: GBP
        metadata:
          description: Additional metadata for the payment
          type: object
          examples:
          - customerId: customer-123
            orderId: '12345'
          additionalProperties:
            type: string
        successUrl:
          description: URL to redirect to on successful payment
          type: string
          examples:
          - https://example.com/success
          pattern: ^https?:\/\/.+$
        failureUrl:
          description: URL to redirect to on failed payment
          type: string
          examples:
          - https://example.com/failure
          pattern: ^https?:\/\/.+$
        cancelUrl:
          description: URL to redirect to on cancelled payment
          type: string
          examples:
          - https://example.com/cancel
          pattern: ^https?:\/\/.+$
        brandId:
          description: Brand ID to use for this payment
          type: string
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        paymentInitiatorId:
          description: The payment initiator ID (integration ID) to use for this payment
          type: string
          format: uuid
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        offSession:
          description: Whether or not the payment is an 'off session' payment. An off session payment is when the customer Payment Method is charged separately from collecting their Payment Method (e.g. card details).
          type: boolean
          examples:
          - false
          const: false
        shippingAddress:
          description: The shipping address
          allOf:
          - $ref: '#/components/schemas/PaymentIntentAddressDto'
        billingAddress:
          description: The billing address
          allOf:
          - $ref: '#/components/schemas/PaymentIntentAddressDto'
        lineItems:
          description: Array of line items, each being either airline, car rental, lodging, or product data
          type:
          - array
          - 'null'
          items:
            discriminator:
              propertyName: type
              mapping:
                AIRLINE: '#/components/schemas/PaymentIntentAirlineDto'
                CAR_RENTAL: '#/components/schemas/PaymentIntentCarRentalDto'
                LODGING: '#/components/schemas/PaymentIntentLodgingDto'
                PRODUCT: '#/components/schemas/PaymentIntentProductDto'
            oneOf:
            - $ref: '#/components/schemas/PaymentIntentAirlineDto'
            - $ref: '#/components/schemas/PaymentIntentCarRentalDto'
            - $ref: '#/components/schemas/PaymentIntentLodgingDto'
            - $ref: '#/components/schemas/PaymentIntentProductDto'
        rewardCalculationId:
          description: Reward calculation ID
          type: string
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        paymentMethodId: {}
        customer:
          description: '**Warning: This feature is not yet implemented.** To save this payment method for later use, use the customer ID from a previous call to /customers'
          type:
          - object
          - 'null'
          properties:
            id:
              description: The customer ID (cus_...) to assign the payment method to
              type: string
              examples:
              - cus_01kaxxrevce8dt6vp581rhnznx
            savePaymentMethod:
              description: Save the payment method for later off-session payments
              type:
              - boolean
              - 'null'
              default: false
            paymentMethodMetadata:
              description: 'Additional metadata for the payment method (only for savePaymentMethod: true)'
              type:
              - object
              - 'null'
              examples:
              - mySubscriptionId: sub-123
              additionalProperties:
                type: string
          required:
          - id
      required:
      - amount
      - currency
      - paymentInitiatorId
    DisputeDto:
      type: object
      properties:
        disputeId:
          type: string
        fundingAttemptId:
          type: string
        provider:
          type: string
        providerRef:
          type: string
        disputeReason:
          type: string
        disputeStatus:
          type: string
          enum:
          - lost
          - needs_response
