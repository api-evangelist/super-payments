  /customers:
    post:
      operationId: create-customer
      summary: Create Customer
      description: This endpoint is used to create a representation of a known customer. You may supply
        your own identifier for a given customer, and will return a Super customer ID upon successful
        creation.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer20260401RequestDto'
      responses:
        '201':
          description: Newly created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer20260401ResponseDto'
      security:
      - api_key: []
      tags:
      - Customer
    get:
      operationId: list-customers
      summary: List Customers
      description: This endpoint lists your previously created customers in a paged list. Additional filters
        and sorting criteria may be provided as query parameters.
      parameters:
      - name: brandId
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - name: externalReference
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: emailAddress
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          format: email
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: by
        in: query
        required: false
        schema:
          type: string
          default: createdAt
          enum:
          - createdAt
          - updatedAt
      - name: pageNumber
        in: query
        required: false
        schema:
          type: number
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
          default: 100
          maximum: 1000
          minimum: 1
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomer20260401ListResponse'
      security:
      - api_key: []
      tags:
      - Customer
