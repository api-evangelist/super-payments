openapi: 3.1.0
info:
  title: Super Payments API
  description: Super Payments is empowering businesses with free payments, allowing them to offer customers
    a % Cash Reward, which is automatically deducted from their next purchase when they pay with Super.
    By rewarding customers in this way, they shop more often and buy more with a business. In addition,
    Cash Rewards boost customer loyalty and retention, with better conversion rates at typically higher
    average order values. Cash Rewards also increase adoption of Super Payments as the checkout method,
    meaning more free payments for your business.
  version: '2026-04-01'
  contact:
    url: https://docs.superpayments.com
  license:
    name: Super Payments
    identifier: https://www.superpayments.com/terms-and-conditions
servers:
- url: https://api.superpayments.com/2026-04-01
  description: Live Environment
- url: https://api.test.superpayments.com/2026-04-01
  description: Sandbox Environment
tags:
- name: Checkout Sessions
  description: Checkout Session management
- name: Payment Links
  description: Manage payment links for one-time payments
- name: Payments
  description: Payment processing and management
- name: Refunds
  description: Refund management
- name: Rewards
  description: Rewards configuration and calculation and management
- name: Settlements
  description: Settlement batches, details, and reconciliation
