    PaymentIntentFeeDto:
      type: object
      properties:
        currency:
          description: The currency of the fee
          type: string
        feeCode:
          description: The fee code
          type: string
        feeAmountInMinorUnits:
          description: The calculated fee amount before VAT. Calculated as (fixedAmountInEffectInMinorUnits
            + rateInEffect * chargeableAmountInMinorUnits)
          type: number
        chargeableAmountInMinorUnits:
          description: the amount from which the fee amount was calculated eg. the payment amount for
            an AMEX transaction.
          type: number
        fixedAmountInEffectInMinorUnits:
          description: A fixed charge applied for the fee code
          type: number
        vatAmountInMinorUnits:
          description: The VAT amount calculated from the feeAmountInMinorUnits
          type:
          - number
          - 'null'
        vatRateInEffect:
          description: The VAT rate e.g. for 20% the rateInEffect is "20.0000"
          type:
          - number
          - 'null'
        rateInEffect:
          description: The rate used to calculate the variable portion of the fee from the chargeableAmountInMinorUnits
            eg. for 2.49% the rateInEffect is "2.4900"
          type: number
        totalFeeAmountInclVatInMinorUnits:
          description: The total fee amount including VAT
          type: number
      required:
      - currency
      - feeCode
      - feeAmountInMinorUnits
      - chargeableAmountInMinorUnits
      - fixedAmountInEffectInMinorUnits
      - vatAmountInMinorUnits
      - vatRateInEffect
      - rateInEffect
      - totalFeeAmountInclVatInMinorUnits
