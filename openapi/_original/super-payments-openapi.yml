      summary: Sent when a customer payment method is disabled
      description: "Configure this webhook in your Business Portal.\n\n<details>\n<summary>HMAC signature\
        \ verification</summary>\n\n\nEvery webhook request includes a super-signature header so you can\
        \ verify it came from Super and hasn't been tampered with.\n\n## Header format\n\nThe header contains\
        \ a timestamp and a signature, separated by a comma:\n\n```super-signature: t:1669219987926,v1:vCcZMqom...base64...```\n\
        \n- `t:` — Unix timestamp in milliseconds, generated when the request was signed\n- `v1:` — HMAC-SHA256\
        \ signature, base64-encoded\n\n## Verifying a request\n\n1. Parse the header. Split on \",\" to\
        \ get the timestamp and signature parts, then split each on \":\" to extract the values.\n2. Build\
        \ the signed message. Concatenate the timestamp and the raw request body, with no separator: \"\
        message = timestamp + raw_body\"\n2. Use the raw bytes of the request body — do not re-serialize\
        \ parsed JSON, as whitespace or key ordering changes will invalidate the signature.\n3. Compute\
        \ the expected signature. Generate an HMAC-SHA256 of message using your webhook secret as the\
        \ key, and base64-encode the result.\n4. Compare signatures. Use a constant-time comparison (e.g.\
        \ crypto.timingSafeEqual in Node, hmac.compare_digest in Python) to avoid timing attacks. Reject\
        \ the request if they\ndon't match.\n5. Check the timestamp. Reject requests whose timestamp is\
        \ more than 5 minutes old to prevent replay attacks.\n\n## Example (Node.js)\n\n```js\nconst crypto\
        \ = require('crypto');\n\nfunction verifySuperSignature(rawBody, header, secret) {\n  const parts\
        \ = Object.fromEntries(\n    header.split(',').map((p) => { return p.split(':'); })\n  );\n  const\
        \ timestamp = parts.t;\n  const signature = parts.v1;\n\n  if (Math.abs(Date.now() - Number(timestamp))\
        \ > 5 * 60 * 1000) {\n    return false;\n  }\n\n  const expected = crypto\n    .createHmac('sha256',\
        \ secret)\n    .update(`${timestamp}${rawBody}`)\n    .digest('base64');\n\n  const expectedBuf\
        \ = Buffer.from(expected, 'base64');\n  const actualBuf = Buffer.from(signature, 'base64');\n\n\
        \  if (expectedBuf.length !== actualBuf.length) {\n    return false;\n  }\n\n  return crypto.timingSafeEqual(expectedBuf,\
        \ actualBuf);\n}\n```\n</details>\n"
