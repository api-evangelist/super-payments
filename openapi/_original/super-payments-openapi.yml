          - string
          - 'null'
        paymentIntentReference:
          description: Payment intent reference associated with the transaction. Will be null when not
            applicable to the transaction type.
          type:
          - string
          - 'null'
        paymentIntentExternalReference:
          description: Payment intent external reference provided when the payment intent was created.
            Will be null when not applicable.
          type:
          - string
          - 'null'
        refundId:
          description: Refund identifier associated with the transaction. Will be null when not applicable
            to the transaction type.
          type:
          - string
          - 'null'
        refundReference:
