          - FEE_LIABILITY_HOLD
          - FLOAT_HOLD
          - MANUAL_ADJUSTMENT_CREDIT
          - MANUAL_ADJUSTMENT_DEBIT
          - MANUAL_ALLOCATION
          - PAYMENT
          - PAYOUT
          - PUBLISHER_COMMISSION_PAYOUT
          - REFUND
          - REFUND_RESERVATION_RELEASE
          - REFUND_TOPUP_TRANSFER_CLAWBACK
          - REWARD_SETTLEMENT
          - ROUNDING_ADJUSTMENT
          - TOPUP_TRANSFER
        paymentIntentId:
          description: Payment intent identifier associated with the transaction. Will be null when not
            applicable to the transaction type.
