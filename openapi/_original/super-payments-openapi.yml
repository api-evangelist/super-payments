  /payment-methods:
    post:
      operationId: create-payment-method
      summary: Create Payment Method
      description: This endpoint creates a new payment method that will be associated with a particular
        customer. This payment method, once set up, can be used to create off-session payments against
        a given customer.
      parameters: []
      requestBody:
        required: true
        content:
