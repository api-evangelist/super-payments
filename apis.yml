aid: super-payments

name: Super Payments

description: Super Payments is a UK payments provider offering free card and open-banking (pay-by-bank) payment processing for businesses, funded
  by a customer-acquisition and cash-rewards model rather than per-transaction fees. Its REST API lets merchants create payments and checkout
  sessions, issue refunds, manage customers and reusable payment methods, run settlements and reconciliation, create no-code payment links, and
  configure cash rewards. The API uses date-based URL versioning, static API-key authentication, RFC 9457 problem+json errors, cursor pagination,
  HMAC-signed webhooks, an embedded super-card web component and hosted payment page, and a React Native SDK. Backed by Accel and Union Square
  Ventures.

